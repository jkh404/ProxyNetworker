name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ProxyNetworker.slnx

      - name: Build
        run: dotnet build ProxyNetworker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ProxyNetworker.Core.Tests/ProxyNetworker.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Test shared client runtime
        run: dotnet test ProxyNetworker.Client.Runtime.Tests/ProxyNetworker.Client.Runtime.Tests.csproj -c Release --no-build --no-restore

      - name: Test client UI and desktop instance control
        run: dotnet test ProxyNetworker.App.Tests/ProxyNetworker.App.Tests.csproj -c Release --no-build --no-restore

      - name: Test Linux offload management tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Test Android package verifier
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Check JavaScript syntax
        run: find ProxyNetworker.Server/wwwroot -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
